[project]
name = "targer"
version = "0.1.0"
description = "TARGER - Argument Mining Segmenter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flasgger==0.9.7.1",
    "flask==3.1.3",
    "flask-cors==6.0.2",
    "flask-restful==0.3.10",
    "gunicorn==25.1.0",
    "h5py==3.15.1",
    "keras==2.15.0",
    "nltk==3.9.3",
    "numpy==1.26.4",
    "prometheus-client==0.24.1",
    "prometheus-flask-exporter==0.23.2",
    "protobuf==4.25.8",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "tensorflow==2.15.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
